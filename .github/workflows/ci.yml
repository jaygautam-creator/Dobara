name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy strict, money path)
        run: uv run mypy agent models sim features

      - name: Unit tests
        run: uv run pytest -q

      - name: Reduced-seed simulator + eval smoke run
        run: |
          uv run python -m sim.run --seeds 1 --cycles 2 --mandates 200
        continue-on-error: false

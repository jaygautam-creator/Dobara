name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check_artifact_freshness.py walks `git log <artifact's commit>..HEAD` --
          # the default shallow (depth-1) checkout has no history to walk, so this
          # step would either error or silently pass for the wrong reason.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy strict)
        # Matches `make check` -- agent/models/sim/features (the money path) plus
        # eval/api/llm/scripts, all under the same strict config (pyproject.toml).
        run: uv run mypy agent models sim features eval api llm scripts

      - name: Build training database
        # data/ is gitignored (see .gitignore's "data/.gitkeep") -- tests/test_eval_invariants.py
        # and tests/test_runner_trace.py read the default-seed sim database
        # (data/dobara.sqlite3, TRAIN_DB_PATH) via models.ltv.build_life_table /
        # agent.models.load_model_bundle, which nothing before this step creates on a
        # clean checkout. The trained models themselves (artifacts/models/*.joblib) ARE
        # committed, so this only needs to reproduce the raw sim output, not retrain --
        # deterministic on the default seed (42), ~13s locally.
        run: uv run python -m sim.run

      - name: Unit tests
        run: uv run pytest -q

      - name: Reduced-seed simulator smoke run
        run: uv run python -m sim.run --seeds 1 --cycles 2 --mandates 200

      - name: Evidence artifact freshness
        # Fails if a committed artifact (artifacts/summary.json etc.) is older than
        # a landed commit to the code that produces it -- see the script's docstring
        # and docs/DECISIONS.md [2026-08-27] for the incident this gate exists to catch.
        run: uv run python -m scripts.check_artifact_freshness

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync artifact data
        # Route type-checking below needs generateStaticParams()'s data (via
        # scripts/sync-data.mjs), and `next typegen` needs the route tree it produces.
        run: npm run sync-data

      - name: Generate route types
        # `LayoutProps<"/">`/`PageProps<...>` (Next.js typed routes) are generated,
        # not checked in -- `next build` normally produces them as a side effect, but
        # the standalone type-check step below runs before any build step, so on a
        # clean checkout (no .next/) tsc fails with "Cannot find name 'LayoutProps'".
        # `next typegen` produces the same .next/types/ without a full build.
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (static export)
        # Exercises scripts/sync-data.mjs against the committed artifacts/ and every
        # generateStaticParams() route -- the same build Vercel runs on deploy.
        run: npm run build
